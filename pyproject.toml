[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenminer"
version = "0.1.0"
description = "Mine free AI models, API credits, tokens and developer deals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TokenMiner contributors" }]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tokenminer = "tokenminer.__main__:main"

[tool.setuptools.packages.find]
include = ["tokenminer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
