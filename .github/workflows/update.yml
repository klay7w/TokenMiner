name: TokenMiner Daily Update

on:
  schedule:
    # 00:05 UTC = 08:05 Beijing, daily
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run TokenMiner update
        run: python -m tokenminer

      - name: Test
        run: pytest -q

      - name: Capture run metadata
        id: meta
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF"
            cat data/update_summary.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: tokenminer/update
          delete-branch: true
          title: "⛏️ TokenMiner Update: ${{ steps.meta.outputs.date }}"
          commit-message: "⛏️ TokenMiner Update: ${{ steps.meta.outputs.date }}"
          body: |
            Auto-generated by the TokenMiner daily update workflow.

            ```
            ${{ steps.meta.outputs.summary }}
            ```
