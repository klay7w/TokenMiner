name: TokenMiner Daily Update

on:
  schedule:
    # 00:05 UTC = 08:05 Beijing, daily
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency: tokenminer-publisher

jobs:
  update:
    if: >-
      github.repository == 'klay7w/TokenMiner' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.TOKENMINER_SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      date: ${{ steps.patch.outputs.date }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run TokenMiner update
        run: python -m tokenminer
      - name: Test
        run: pytest -q
      - id: patch
        run: |
          git add -A
          git diff --cached --no-ext-diff --binary > "$RUNNER_TEMP/update.patch"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          if test -s "$RUNNER_TEMP/update.patch"; then echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - id: upload
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-patch
          path: ${{ runner.temp }}/update.patch
          retention-days: 1

  publish:
    needs: update
    if: github.repository == 'klay7w/TokenMiner' && github.ref == 'refs/heads/main' && needs.update.outputs.artifact != ''
    environment: tokenminer-publisher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-policy.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.update.outputs.artifact }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - name: Prepare one commit from the validated index (never check it out)
        id: prepare
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git apply --cached --whitespace=nowarn "$RUNNER_TEMP/candidate/update.patch"
          tree=$(git write-tree)
          python -m scripts.publisher_policy HEAD
          test "$(git write-tree)" = "$tree"
          commit=$(git -c user.name='TokenMiner Publisher' -c user.email='noreply@users.noreply.github.com' commit-tree "$tree" -p "$GITHUB_SHA" -m "TokenMiner daily update (run $GITHUB_RUN_ID)")
          test "$(git show -s --format='%T %P' "$commit")" = "$tree $GITHUB_SHA"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Stop if the fixed publishing lane is occupied or main has moved
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          pulls=$(curl --fail --silent --show-error 'https://api.github.com/repos/klay7w/TokenMiner/pulls?state=open&head=klay7w%3Atokenminer%2Fupdate')
          jq -e 'type == "array" and length == 0' <<< "$pulls" > /dev/null || { echo 'Open publisher PR: stop for human decision'; exit 1; }
          refs=$(git ls-remote origin refs/heads/tokenminer/update)
          test -z "$refs" || { echo 'Publisher branch already exists: stop for human decision'; exit 1; }
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ vars.TOKENMINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.TOKENMINER_APP_PRIVATE_KEY }}
          owner: klay7w
          repositories: TokenMiner
          permission-contents: write
          permission-pull-requests: write
      - name: Create branch only if absent
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          COMMIT: ${{ steps.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          ref=refs/heads/tokenminer/update
          remote=https://github.com/klay7w/TokenMiner.git
          gh api repos/klay7w/TokenMiner | jq -e '.id == 1365206090 and .full_name == "klay7w/TokenMiner"' >/dev/null
          test "$(git ls-remote --exit-code "$remote" refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          # Empty expected value forbids replacing a ref. Exit 0 alone also means 'up to date'.
          result=$(git -c credential.helper= -c 'credential.https://github.com.helper=!gh auth git-credential' -c http.followRedirects=false -c push.followTags=false push --porcelain --force-with-lease="$ref:" "$remote" "$COMMIT:$ref")
          awk -F '\t' -v mapping="$COMMIT:$ref" 'NF >= 3 {n++; if ($1 == "*" && $2 == mapping && $3 == "[new branch]") created++} END {exit !(n == 1 && created == 1)}' <<< "$result" || { echo 'No confirmed new branch; STOP, inspect read-only'; exit 1; }
      - name: Open exactly one new PR and verify its refs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          COMMIT: ${{ steps.prepare.outputs.commit }}
          UPDATE_DATE: ${{ needs.update.outputs.date }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          api=repos/klay7w/TokenMiner
          verify_refs() {
            gh api "$api" | jq -e '.id == 1365206090 and .full_name == "klay7w/TokenMiner"' >/dev/null
            test "$(gh api "$api/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
            test "$(gh api "$api/git/ref/heads/tokenminer/update" --jq .object.sha)" = "$COMMIT"
          }
          verify_pr() {
            jq -e --arg head "$COMMIT" --arg base "$GITHUB_SHA" --arg author "${APP_SLUG}[bot]" --argjson n "$1" '
              .number == $n and .state == "open" and .user.type == "Bot" and .user.login == $author and
              .head.repo.id == 1365206090 and .base.repo.id == 1365206090 and
              .head.ref == "tokenminer/update" and .head.sha == $head and
              .base.ref == "main" and .base.sha == $base' >/dev/null
          }
          verify_refs
          gh api "$api/pulls?state=open&head=klay7w%3Atokenminer%2Fupdate" | jq -e 'type == "array" and length == 0' >/dev/null
          pr=$(gh api --method POST "$api/pulls" -f head=tokenminer/update -f base=main -f title="⛏️ TokenMiner Update: $UPDATE_DATE" -f body='Daily generated update. See `data/update_summary.txt` in Files changed.')
          n=$(jq -er '.number | select(type == "number" and . > 0 and floor == .)' <<< "$pr")
          verify_pr "$n" <<< "$pr"
          gh api "$api/pulls/$n" | verify_pr "$n"
          verify_refs
          echo "Created PR #$n for checked commit $COMMIT"
